name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1, luacheck and xmllint
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.1 lua-check libxml2-utils zip

      - name: Check the tag matches the modDesc.xml version
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' modDesc.xml | head -n 1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match modDesc.xml version ${version}" >&2
            exit 1
          fi

      - name: Lint, validate and test
        run: |
          luacheck scripts tests
          xmllint --noout modDesc.xml
          lua5.1 tests/run.lua

      - name: Build mod zip
        run: bash tools/build.sh

      - name: Extract release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/FS25_HomeSpots.zip \
            --title "Home Spots ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
