name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Work out the release tag
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' modDesc.xml | head -n 1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Install Lua 5.1, luacheck and xmllint
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.1 lua-check libxml2-utils zip

      - name: Check the tag matches the modDesc.xml version
        run: |
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match modDesc.xml version ${VERSION}" >&2
            exit 1
          fi

      - name: Lint, validate and test
        run: |
          luacheck scripts tests
          xmllint --noout modDesc.xml
          lua5.1 tests/run.lua

      - name: Build mod zip
        run: bash tools/build.sh

      - name: Extract release notes from the changelog
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for ${VERSION}" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" dist/FS25_HomeSpots.zip \
            --target "${GITHUB_SHA}" \
            --title "Home Spots ${VERSION}" \
            --notes-file release-notes.md
